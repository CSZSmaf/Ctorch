name: CPU
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            config: Debug
            shared: 'OFF'
          - os: windows-latest
            config: Release
            shared: 'ON'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B ../Ctorch-build -DCTORCH_BUILD_TESTS=ON -DCTORCH_BUILD_EXAMPLES=ON -DCTORCH_USE_ONNX=ON -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DBUILD_SHARED_LIBS=${{ matrix.shared }}
      - name: Build
        run: cmake --build ../Ctorch-build --config ${{ matrix.config }} --parallel 2
      - name: Verify
        run: ctest --test-dir ../Ctorch-build -C ${{ matrix.config }} --output-on-failure
